<svg xmlns="http://www.w3.org/2000/svg" width="280" height="48" viewBox="0 0 280 48" role="img" aria-label="Murphy Software Solutions">
  <defs>
    <!-- Gradient for M (charcoal/gray with depth) -->
    <linearGradient id="mGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3A3F4A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2A2F3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1F2A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for S (blue with shine) -->
    <linearGradient id="sGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    
    <!-- Highlight/shine for M -->
    <linearGradient id="mHighlight" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
    
    <!-- Highlight/shine for S -->
    <linearGradient id="sHighlight" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- MS Monogram -->
  <g transform="translate(0, 4)">
    <!-- M (charcoal with gradient) -->
    <path d="M0,40 L0,6 L5,6 L12,22 L19,6 L24,6 L24,40 L19,40 L19,20 L12,40 L5,20 L5,40 Z"
          fill="url(#mGradient)"/>
    <path d="M0,40 L0,6 L5,6 L12,22 L19,6 L24,6 L24,40 L19,40 L19,20 L12,40 L5,20 L5,40 Z"
          fill="url(#mHighlight)"/>
    
    <!-- S (blue with gradient) -->
    <path d="M32,5 L46,5 L46,10 L38,10 L46,20 L46,40 L28,40 L28,35 L36,35 L28,25 L28,5 Z"
          fill="url(#sGradient)"/>
    <path d="M32,5 L46,5 L46,10 L38,10 L46,20 L46,40 L28,40 L28,35 L36,35 L28,25 L28,5 Z"
          fill="url(#sHighlight)"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(52, 0)">
    <!-- Murphy (white, bold) -->
    <text x="0" y="26"
          fill="#FFFFFF"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="22"
          font-weight="700"
          letter-spacing="-0.4">
      Murphy
    </text>
    
    <!-- Software Solutions (lighter gray, regular) -->
    <text x="0" y="42"
          fill="#94A3B8"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="13"
          font-weight="400"
          letter-spacing="0.2">
      Software Solutions
    </text>
  </g>
</svg>
